name: Automated Interface & System Compliance Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-compliance-matrix:
    runs-on: ubuntu-latest

    steps:
    - name: Stream Repository Assets from Source Context
      uses: actions/checkout@v3

    - name: Initialize Isolated Environment Runtime Context (Python 3.10)
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Execute Live Automated Data Schema Verification Suite
      run: |
        python test_Json_engine.py

    - name: Initialize Automated Local Relational Persistence Seed
      run: |
        python seed_engine.py

    - name: Execute Autonomous Pipeline Governance Rules
      run: |
        python ai_compliance_judge.py
